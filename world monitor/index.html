<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d13" />
    <meta name="description" content="WorldMonitor — a real-time global intelligence and economic monitoring terminal." />
    <title>WorldMonitor — Global Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div class="startup-warning">WorldMonitor needs JavaScript to run. Enable JavaScript in your browser settings and reload the page.</div>
    </noscript>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var app = document.getElementById('app');
          if (!app || app.childElementCount > 0) return;
          var note = document.createElement('div');
          note.className = 'startup-warning';
          note.textContent = 'WorldMonitor did not finish loading. The app runs entirely on JavaScript; your browser could not execute it. Try an up-to-date version of Chrome, Edge, or Firefox. If the problem persists, press F12 and check the Console tab for error messages, then keep the server terminal window open.';
          document.body.appendChild(note);
        }, 5000);
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
